# =============================================================================
# ToolWise CI Pipeline
# =============================================================================
# Runs on every push and pull request to main/develop.
# Modular design: each check is an independent job so failures are isolated
# and jobs can run in parallel for speed.
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same PR/branch to save runner minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── Shared environment ────────────────────────────────────────────────────────
env:
  NODE_VERSION: "20"

jobs:
  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  1. Install & Cache Dependencies                                       │
  # │  Shared setup job — all downstream jobs restore from this cache.       │
  # └─────────────────────────────────────────────────────────────────────────┘
  install:
    name: 📦 Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  2. TypeScript Type Check                                              │
  # │  Ensures zero type errors across the entire codebase.                  │
  # └─────────────────────────────────────────────────────────────────────────┘
  typecheck:
    name: 🔎 Type Check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run TypeScript compiler (no emit)
        run: npm run typecheck

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  3. Syntax & Lint Check                                                │
  # │  Validates code syntax by attempting a full Vite build parse.          │
  # └─────────────────────────────────────────────────────────────────────────┘
  syntax:
    name: ✅ Syntax Check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run syntax validation
        run: npm run syntax-check

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  4. Build Verification                                                 │
  # │  Full production build — catches runtime import errors, missing        │
  # │  modules, and bundler issues that type-check alone won't find.         │
  # └─────────────────────────────────────────────────────────────────────────┘
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [typecheck, syntax]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build production bundle
        run: npm run build
        env:
          # Provide dummy env vars so the build doesn't fail on missing secrets
          VITE_GEMINI_API_KEY: "ci-placeholder"
          VITE_SUPABASE_URL: "https://placeholder.supabase.co"
          VITE_SUPABASE_ANON_KEY: "ci-placeholder"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  5. Unit Tests                                                         │
  # │  Runs the test suite from the tests/ directory.                        │
  # └─────────────────────────────────────────────────────────────────────────┘
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run tests
        run: npm test

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │  6. CI Gate                                                            │
  # │  Single status check for branch protection. Requires all jobs above.   │
  # └─────────────────────────────────────────────────────────────────────────┘
  ci-gate:
    name: 🚦 CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs: [typecheck, syntax, build, test]
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.typecheck.result }}" != "success" ||
                "${{ needs.syntax.result }}" != "success" ||
                "${{ needs.build.result }}" != "success" ||
                "${{ needs.test.result }}" != "success" ]]; then
            echo "❌ One or more CI jobs failed."
            exit 1
          fi
          echo "✅ All CI checks passed!"
